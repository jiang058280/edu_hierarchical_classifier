<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的作业 · 知学课堂</title><link rel="stylesheet" href="/static/edu.css"></head>
<body><div id="shell"></div>
<main class="content student-dashboard">
  <header class="dashboard-intro"><div><div class="eyebrow">学习任务</div><h2>我的作业</h2><p>按截止时间安排任务，提交后可查看客观题结果和教师批改。</p></div><button class="btn plain sm" id="refreshBtn" onclick="loadAssignments()">刷新作业</button></header>
  <section class="summary-grid" id="assignmentSummary">
    <div class="summary-tile"><div class="summary-label">全部作业</div><div class="summary-value" id="summaryAll">—</div></div><div class="summary-tile"><div class="summary-label">待完成</div><div class="summary-value" id="summaryPending">—</div></div><div class="summary-tile"><div class="summary-label">已提交</div><div class="summary-value" id="summarySubmitted">—</div></div><div class="summary-tile"><div class="summary-label">已批改</div><div class="summary-value" id="summaryChecked">—</div></div>
  </section>
  <section class="card dashboard-panel">
    <div class="dashboard-panel-head"><div><h3>作业列表</h3><p class="muted" style="margin-top:3px;font-size:12px">临近截止且未完成的任务会优先展示。</p></div><span class="badge b-info" id="visibleCount">正在读取</span></div>
    <nav class="assignment-tabs" id="assignmentTabs"><button class="active" data-filter="all">全部<span class="tab-count" id="count-all">0</span></button><button data-filter="pending">待完成<span class="tab-count" id="count-pending">0</span></button><button data-filter="submitted">已提交<span class="tab-count" id="count-submitted">0</span></button><button data-filter="checked">已批改<span class="tab-count" id="count-checked">0</span></button></nav>
    <div class="assignment-list" id="assignmentList"><div class="dashboard-empty"><span>正在读取作业…</span></div></div>
  </section>
</main>
<script src="/static/student_common.js?v=20260914-assignments-route"></script>
<script>
const $=id=>document.getElementById(id);T2.renderShell('assignments','我的作业');let assignments=[],activeFilter='all',loading=false;
function formatTime(value){return value?T2.escapeHtml(String(value).replace('T',' ').slice(0,16)):'不限'}
function overdue(item){return Boolean(item.due_at&&new Date(String(item.due_at).replace(' ','T')).getTime()<Date.now())}
function filtered(){return assignments.filter(item=>activeFilter==='all'||(activeFilter==='pending'?['not_started','in_progress'].includes(item.status):item.status===activeFilter))}
function emptyState(){return '<div class="dashboard-empty"><svg width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 10.5h20a5 5 0 015 5V37H15a5 5 0 01-5-5V10.5z"/><path d="M35 37V16a5.5 5.5 0 015.5-5.5H42V32a5 5 0 01-5 5h-2zM16 18h12M16 24h9"/></svg><b>当前分类下没有作业</b><span>老师发布新任务后会显示在这里。</span></div>'}
function render(){if(loading){$('assignmentList').innerHTML='<div class="dashboard-empty"><span>正在读取作业…</span></div>';return}const items=filtered();$('visibleCount').textContent=`${items.length} 项`;const ordered=[...items].sort((a,b)=>{const doneA=['submitted','checked'].includes(a.status),doneB=['submitted','checked'].includes(b.status);if(doneA!==doneB)return doneA?1:-1;return new Date(a.due_at||'2999-12-31')-new Date(b.due_at||'2999-12-31')});$('assignmentList').innerHTML=ordered.length?ordered.map(item=>{const submitted=['submitted','checked'].includes(item.status),isLate=overdue(item),label=submitted?'查看结果':isLate?'已截止':'开始作答';return `<article class="assignment-item"><div class="assignment-subject-mark">${T2.escapeHtml((item.subject||'课').slice(0,1))}</div><div style="flex:1;min-width:0"><div class="row"><span class="assignment-title">${T2.escapeHtml(item.title)}</span>${T2.statusBadge(item.status)}${isLate&&!submitted?'<span class="badge b-bad">已截止</span>':''}</div><div class="assignment-meta">${T2.escapeHtml(item.subject||'未指定学科')} · ${item.mode==='exam'?'考试':'课后作业'} · 截止 ${formatTime(item.due_at)}</div>${submitted?`<div class="assignment-meta">自动得分 ${item.auto_score==null?'待评':item.auto_score}${item.final_score==null?'':` · 最终分 ${item.final_score}`}</div>`:''}</div><div class="item-action"><a class="btn ${submitted?'ghost':'student'} sm" ${isLate&&!submitted?'style="pointer-events:none;opacity:.48" aria-disabled="true"':''} href="/student/assignments/${item.id}${submitted?'?result=1':''}">${label}</a></div></article>`}).join(''):emptyState()}
function setMetric(id,value){$(id).innerHTML=`${value}<small>项</small>`}
async function loadAssignments(){if(loading)return;loading=true;$('refreshBtn').disabled=true;render();try{const data=await T2.api('/api/v1/student/assignments');assignments=data.items||[];const pending=assignments.filter(item=>['not_started','in_progress'].includes(item.status)).length,submitted=assignments.filter(item=>item.status==='submitted').length,checked=assignments.filter(item=>item.status==='checked').length;setMetric('summaryAll',assignments.length);setMetric('summaryPending',pending);setMetric('summarySubmitted',submitted);setMetric('summaryChecked',checked);$('count-all').textContent=assignments.length;$('count-pending').textContent=pending;$('count-submitted').textContent=submitted;$('count-checked').textContent=checked}catch(error){T2.toast(error.message,'err');$('assignmentList').innerHTML=`<div class="dashboard-empty"><b>作业读取失败</b><span>${T2.escapeHtml(error.message)}</span></div>`}finally{loading=false;$('refreshBtn').disabled=false;render()}}
$('assignmentTabs').addEventListener('click',event=>{const button=event.target.closest('button[data-filter]');if(!button)return;activeFilter=button.dataset.filter;$('assignmentTabs').querySelectorAll('button').forEach(item=>item.classList.toggle('active',item===button));render()});
if(T2.token())loadAssignments();else location.href='/login?portal=student&next=%2Fstudent%2Fassignments';
</script></body></html>
