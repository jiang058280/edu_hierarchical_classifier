<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>复核工作台 · 教师门户</title><link rel="stylesheet" href="/static/edu.css"></head><body><div id="shell"></div><main class="content"><div class="page-head"><h2>复核工作台</h2><p>汇总低置信分类、异常错题和 RAG 证据/反馈异常；原始记录不会在此页被修改。</p></div><section class="card"><div class="card-head"><h3>待复核队列</h3><button class="btn plain sm" onclick="loadQueue()">刷新</button></div><div id="queue" class="muted">正在加载…</div></section></main><script src="/static/teacher_common.js?v=20260912-e1"></script><script>const $=id=>document.getElementById(id),esc=T.escapeHtml;T.renderShell('review','复核工作台');async function loadQueue(){try{const d=await T.api('/api/v1/teacher/review-queue');$('queue').innerHTML=d.items.length?d.items.map(x=>`<article style="padding:15px 0;border-bottom:1px solid var(--border)"><div class="row"><b>${esc(x.title)}</b><span class="badge ${x.kind==='low_confidence'?'b-warn':x.kind==='question_anomaly'?'b-bad':'b-info'}">${esc(x.kind)}</span></div><div style="line-height:1.65;margin-top:8px">${esc(x.content).slice(0,300)}</div><div class="muted" style="margin-top:7px">${esc(x.evidence)} · ${esc(x.created_at||'')}</div>${x.question_id?`<a class="btn ghost sm" style="margin-top:9px" href="/teacher/bank">查看题库并修正</a>`:''}</article>`).join(''):'<div class="empty">当前没有需要复核的记录。</div>'}catch(e){$('queue').textContent=e.message}}loadQueue();</script></body></html>
