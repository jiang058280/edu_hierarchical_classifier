<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>错题与练习 · 知学课堂</title><link rel="stylesheet" href="/static/edu.css"></head>
<body><div id="shell"></div><main class="content" style="max-width:1120px"><div class="page-head"><h2>错题与练习</h2><p>错题按题目聚合；完成重练后可标记为已掌握。</p></div>
<section class="card" style="margin-bottom:18px"><div class="card-head"><div><h3>我的学情</h3><p class="muted" style="margin-top:4px">掌握度由真实作答、近期表现与重练记录计算。</p></div><button class="btn plain sm" onclick="loadProfile()">更新画像</button></div><div id="profileList" class="muted">正在计算画像…</div></section>
<section class="card" style="margin-bottom:18px"><div class="card-head"><div><h3>为你推荐</h3><p class="muted" style="margin-top:4px">优先覆盖薄弱知识点，并降低近期重复题权重。</p></div><button class="btn plain sm" onclick="loadRecommendations()">换一批</button></div><div id="recommendations" class="muted">正在生成题单…</div></section>
<section class="card" style="margin-bottom:18px"><div class="card-head"><div><h3>巩固任务</h3><p class="muted" style="margin-top:4px">把错题、薄弱点和间隔复习组合成可直接提交的练习。</p></div></div><div class="row" style="gap:10px;flex-wrap:wrap"><button class="btn student sm" onclick="loadTask('weak')">薄弱点专项</button><button class="btn plain sm" onclick="loadTask('daily')">生成今日练习</button></div><div id="taskHint" class="muted" style="margin-top:10px">可从下方错题点击“同类巩固”，或直接生成专项练习。</div></section>
<section class="card"><div class="card-head"><h3>自主练习</h3><button class="btn student" onclick="loadPractice()">开始练习</button></div><div class="row" style="align-items:end;flex-wrap:wrap"><label style="min-width:180px;flex:1">学科<input id="subject" class="input" placeholder="如 数学"></label><label style="min-width:180px;flex:1">知识点<input id="knowledge" class="input" placeholder="如 一次函数"></label><label style="width:110px">题数<input id="limit" class="input" type="number" min="1" max="20" value="5"></label></div><div id="practice" style="margin-top:15px"></div></section>
<section class="card" style="margin-top:18px"><div class="card-head"><div><h3>我的错题</h3><p class="muted" style="margin-top:4px">只显示尚未标记掌握的题目</p></div><button class="btn plain sm" onclick="loadWrongBook()">刷新</button></div><div id="wrongList"></div></section></main>
<script src="/static/student_common.js?v=20260914-assignments-route"></script><script>
const $=id=>document.getElementById(id);T2.renderShell('wrong','错题与练习');let practiceItems=[],wrongItems=[],redoQuestionId=null,practiceSource='practice';
const esc=T2.escapeHtml;function options(item){return (item.options||[]).map(x=>`<div class="muted" style="margin-top:5px">${esc(typeof x==='object'?`${x.key}. ${x.text}`:x)}</div>`).join('')}
async function loadWrongBook(){try{const d=await T2.api('/api/v1/student/wrong-book');wrongItems=d.items||[];$('wrongList').innerHTML=wrongItems.length?wrongItems.map(x=>`<article style="padding:15px 0;border-bottom:1px solid var(--border)"><div class="row"><b>${esc(x.subject||'未分类')} · ${esc(x.question_type||'题目')}</b><span class="badge b-warn">错 ${x.wrong_count} 次</span></div><div style="margin-top:8px;line-height:1.7">${esc(x.content)}</div>${options(x)}<div class="muted" style="margin-top:8px">知识点：${esc(x.knowledge_point||'未标注')} · 最近错误：${esc(x.last_wrong_at||'—')}</div><div class="row" style="margin-top:10px;gap:8px"><button class="btn student sm" onclick="redo(${x.question_id})">重练此题</button><button class="btn plain sm" onclick="loadTask('wrong',${x.question_id})">同类巩固</button><button class="btn ghost sm" onclick="resolve(${x.question_id})">标记已掌握</button></div></article>`).join(''):'<div class="empty">暂无待巩固错题</div>'}catch(e){T2.toast(e.message,'err')}}
async function loadProfile(){try{const d=await T2.api('/api/v1/student/analytics/me');$('profileList').innerHTML=d.items?.length?d.items.map(x=>`<div style="display:grid;grid-template-columns:minmax(130px,1fr) 2fr 70px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)"><b>${esc(x.knowledge_point)}</b><div><div style="height:7px;background:#e8edf8;border-radius:4px"><span style="display:block;width:${Math.round(x.mastery_score*100)}%;height:7px;border-radius:4px;background:${x.mastery_score<.5?'#e99055':'#31a47a'}"></span></div><small class="muted">${x.attempt_count} 次作答 · 近期正确率 ${Math.round(x.recent_correct_rate*100)}%</small></div><b>${Math.round(x.mastery_score*100)}%</b></div>`).join(''):'<div class="empty">暂时没有带知识点标签的已判分作答</div>'}catch(e){$('profileList').textContent=e.message}}
async function loadRecommendations(){try{const d=await T2.api('/api/v1/student/recommendations?limit=6');$('recommendations').innerHTML=d.items?.length?d.items.map((x,i)=>`<article style="display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--border)"><b style="color:var(--primary)">${i+1}</b><div><b>${esc(x.knowledge_point||'未标注知识点')} · ${esc(x.question_type)}</b><div style="margin-top:5px;line-height:1.65">${esc(x.content).slice(0,100)}${x.content.length>100?'…':''}</div><div class="muted" style="font-size:12px;margin-top:5px">${x.reasons.map(esc).join(' · ')}</div></div><span class="badge b-info">难度 ${esc(x.difficulty||'—')}</span></article>`).join(''):'<div class="empty">完成带知识点标签的作答后即可获得个性化推荐</div>'}catch(e){$('recommendations').textContent=e.message}}
async function resolve(id){try{await T2.api(`/api/v1/student/wrong-book/${id}/resolve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resolved:true})});T2.toast('已标记掌握','ok');loadWrongBook()}catch(e){T2.toast(e.message,'err')}}
async function loadTask(kind,id){try{let url=kind==='wrong'?`/api/v1/student/consolidation/wrong/${id}?limit=5`:kind==='weak'?'/api/v1/student/consolidation/weak?top_n=3&per_point=3':'/api/v1/student/consolidation/daily?limit=10';const d=await T2.api(url);redoQuestionId=null;practiceSource=d.plan_type;practiceItems=d.items||[];$('taskHint').textContent=d.items?.length?`${d.title} · ${d.message}`:'暂未找到足够题目，请先完成带知识点标签的作答或补充题库。';renderPractice();window.scrollTo({top:document.querySelector('#practice').getBoundingClientRect().top+window.scrollY-80,behavior:'smooth'})}catch(e){T2.toast(e.message,'err')}}
async function loadPractice(){redoQuestionId=null;practiceSource='practice';const p=new URLSearchParams({subject:$('subject').value.trim(),knowledge_point:$('knowledge').value.trim(),limit:$('limit').value||5});try{const d=await T2.api('/api/v1/student/practice/questions?'+p);practiceItems=d.items||[];renderPractice()}catch(e){T2.toast(e.message,'err')}}
function renderPractice(){ $('practice').innerHTML=practiceItems.length?practiceItems.map((x,i)=>`<article class="card" style="margin-top:10px;padding:14px"><b>第 ${i+1} 题 · ${esc(x.question_type)}</b><div style="margin-top:8px;line-height:1.7">${esc(x.content)}</div>${options(x)}<input class="input practice-answer" data-id="${x.id}" style="margin-top:10px" placeholder="输入答案"></article>`).join('')+'<button class="btn student" style="margin-top:12px" onclick="submitPractice()">提交练习</button>':'<div class="empty">未找到符合条件的已发布题目</div>'}
function redo(id){const item=wrongItems.find(x=>x.question_id===id);if(!item){T2.toast('错题信息已更新，请刷新','err');return}redoQuestionId=id;practiceSource='wrong_redo';practiceItems=[{...item,id:item.question_id}];renderPractice();window.scrollTo({top:0,behavior:'smooth'})}
async function submitPractice(){const answers=[...document.querySelectorAll('.practice-answer')].map(x=>({question_id:Number(x.dataset.id),answer:x.value.trim()}));if(!answers.length)return;try{const r=await T2.api('/api/v1/student/practice/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers,source:redoQuestionId?'wrong_redo':practiceSource})});T2.toast(r.score==null?'已记录练习':'练习得分 '+r.score+' 分','ok');loadWrongBook();loadProfile();loadRecommendations()}catch(e){T2.toast(e.message,'err')}}
if(T2.token()){loadWrongBook();loadProfile();loadRecommendations()}else location.href='/login?portal=student&next=%2Fstudent%2Fwrong-book';
</script></body></html>
