<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>组卷与试卷 · 教师门户</title>
<link rel="stylesheet" href="/static/edu.css">
</head>
<body>
<div id="shell"></div>
<div class="content">
  <div class="page-head"><h2>组卷与试卷</h2><p>按题型配比与学段从题库抽题组卷，保存后可导出 Word 打印版</p></div>

  <div class="card">
    <h3>① 组卷条件</h3>
    <div class="row" style="margin-bottom:10px">
      <select class="input" id="gSubject" style="width:130px"></select>
      <select class="input" id="gBand" style="width:110px"><option value="">全部学段</option><option>初中</option><option>高中</option></select>
      <input class="input" type="text" id="gKp" placeholder="知识点（可空）" style="width:160px">
      <select class="input" id="gDiff" style="width:130px">
        <option value="">任意难度</option><option value="1">★ 基础</option><option value="3">★★★ 中档</option><option value="5">★★★★★ 拔高</option>
      </select>
    </div>
    <div class="muted" style="margin-bottom:6px">题型配比（括号内为当前筛选条件下可用题数）：</div>
    <div class="row" id="typeCounts"><span class="muted">请选择学科</span></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="generateBtn" onclick="generate()">生成试卷</button><span class="muted" id="stockHint"></span></div>
  </div>

  <div class="card" id="previewCard" style="display:none">
    <div class="card-head">
      <h3>② 试卷预览（取消勾选可剔除题目）</h3>
      <input class="input" type="text" id="paperTitle" placeholder="试卷标题，如 初三数学期中卷" style="width:240px">
    </div>
    <div id="previewList" style="max-height:420px;overflow:auto"></div>
    <div class="row" style="margin-top:12px">
      <span class="muted" id="pickInfo"></span>
      <span style="flex:1"></span>
      <button class="btn" onclick="savePaper()">保存为试卷</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>我的试卷</h3>
      <button class="btn plain sm" onclick="loadPapers()">刷新</button></div>
    <table class="table">
      <thead><tr><th>序号</th><th>标题</th><th>学科</th><th>学段</th><th>题数</th><th>创建时间</th><th style="width:170px">操作</th></tr></thead>
      <tbody id="paperRows"></tbody>
    </table>
  </div>
</div>

<script src="/static/teacher_common.js?v=20260909-h"></script>
<script>
const $ = (id) => document.getElementById(id);
T.renderShell('papers', '组卷与试卷');
let generated = [];
let taxonomy = null;

async function loadTaxonomy() {
  const subject = $('gSubject').value, band = $('gBand').value;
  if (!subject) return;
  try {
    const params = new URLSearchParams({subject, grade_band: band, knowledge: $('gKp').value.trim()});
    if ($('gDiff').value) params.set('difficulty', $('gDiff').value);
    taxonomy = await T.api('/api/v1/teacher/question-taxonomy?' + params);
    $('typeCounts').innerHTML = taxonomy.types.map(t => `
      <label style="display:flex;align-items:center;gap:5px;padding:6px 8px;border:1px solid var(--border);border-radius:8px">
        <span>${T.escapeHtml(t.name)} <span class="muted">(${t.available_count})</span></span>
        <input class="input num type-count" type="number" data-qtype="${T.escapeHtml(t.name)}" value="0" min="0" max="${t.available_count}" style="width:62px" ${t.available_count ? '' : 'disabled'}>
      </label>`).join('');
    const choice = $('typeCounts').querySelector('[data-qtype="选择题"]');
    const solve = $('typeCounts').querySelector('[data-qtype="解答题"]');
    if (choice) choice.value = Math.min(10, Number(choice.max));
    if (solve) solve.value = Math.min(4, Number(solve.max));
    const total = taxonomy.types.reduce((sum, t) => sum + t.available_count, 0);
    $('stockHint').textContent = `当前条件共 ${total} 道已发布题目`;
    $('generateBtn').disabled = total === 0;
  } catch (e) { T.toast(e.message, 'err'); }
}

async function initTaxonomy() {
  try {
    const data = await T.api('/api/v1/teacher/question-taxonomy');
    $('gSubject').innerHTML = data.subjects.map(s => `<option>${T.escapeHtml(s)}</option>`).join('');
    await loadTaxonomy();
  } catch (e) { T.toast(e.message, 'err'); }
}
$('gSubject').addEventListener('change', loadTaxonomy);
$('gBand').addEventListener('change', loadTaxonomy);
$('gDiff').addEventListener('change', loadTaxonomy);
$('gKp').addEventListener('change', loadTaxonomy);

async function generate() {
  const subject = $('gSubject').value;
  if (!subject) { T.toast('请选择学科', 'err'); return; }
  const type_counts = {};
  $('typeCounts').querySelectorAll('.type-count').forEach(input => {
    const n = parseInt(input.value) || 0;
    if (n > 0) type_counts[input.dataset.qtype] = n;
  });
  if (!Object.keys(type_counts).length) { T.toast('至少设置一种题型的数量', 'err'); return; }
  try {
    const data = await T.api('/api/v1/teacher/papers/generate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        subject, grade_band: $('gBand').value, knowledge: $('gKp').value.trim(),
        difficulty: $('gDiff').value ? parseInt($('gDiff').value) : null, type_counts
      })
    });
    generated = data.questions;
    renderPreview();
    const shortage = (data.shortages || []).map(x => `${x.question_type}需${x.requested}道/仅${x.available}道`).join('；');
    T.toast('已生成 ' + data.total + ' 题' + (shortage ? '；题量不足：' + shortage : '，勾选后保存'), shortage ? 'err' : 'ok');
  } catch (e) { T.toast(e.message, 'err'); }
}

function renderPreview() {
  $('previewCard').style.display = '';
  $('previewList').innerHTML = generated.map((q, i) => `
    <label class="row" style="padding:8px 6px;border-bottom:1px dashed var(--border);cursor:pointer;align-items:flex-start">
      <input type="checkbox" checked data-idx="${i}" style="margin-top:4px">
      <span style="flex:1">
        <b class="num">${i + 1}.</b>（${T.escapeHtml(q.question_type)}）
        ${T.escapeHtml(T.cleanText(q.content).slice(0, 90))}${T.cleanText(q.content).length > 90 ? '…' : ''}
        <span class="muted">｜# ${q.id}｜${T.escapeHtml(q.knowledge_point || '知识点未标')}</span>
      </span>
    </label>`).join('');
  updatePick();
  $('previewList').addEventListener('change', updatePick);
}
function updatePick() {
  const n = [...$('previewList').querySelectorAll('input:checked')].length;
  $('pickInfo').textContent = '已选 ' + n + ' / ' + generated.length + ' 题';
}

async function savePaper() {
  const title = $('paperTitle').value.trim();
  const ids = [...$('previewList').querySelectorAll('input:checked')]
    .map(el => generated[parseInt(el.dataset.idx)].id);
  if (!title) { T.toast('请填写试卷标题', 'err'); return; }
  if (!ids.length) { T.toast('请至少保留一道题', 'err'); return; }
  try {
    const r = await T.api('/api/v1/teacher/papers', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({title, subject: $('gSubject').value,
        grade_band: $('gBand').value || '高中', question_ids: ids})
    });
    T.toast('试卷已保存', 'ok');
    $('previewCard').style.display = 'none'; generated = [];
    loadPapers();
  } catch (e) { T.toast(e.message, 'err'); }
}

async function loadPapers() {
  try {
    const data = await T.api('/api/v1/teacher/papers');
    data.items = data.items || []; data.total = data.total || 0;
    $('paperRows').innerHTML = data.items.length ? data.items.map((p, index) => `
      <tr>
        <td class="num">${index + 1}</td><td><b>${T.escapeHtml(p.title)}</b></td>
        <td>${T.escapeHtml(p.subject)}</td><td>${T.escapeHtml(p.grade_band)}</td>
        <td class="num">${p.question_count}</td><td class="muted">${p.created_at}</td>
        <td>
          <button class="btn ghost sm" onclick="T.downloadFile('/api/v1/teacher/papers/${p.id}/export', '${T.escapeHtml(p.title)}.docx').catch(e => T.toast(e.message, 'err'))">导出 Word</button>
          <button class="btn danger sm" onclick="removePaper(${p.id})">删除</button>
        </td>
      </tr>`).join('')
      : '<tr><td colspan="7"><div class="empty"><div class="ico">📄</div>还没有试卷<div class="hint">设置组卷条件并生成后保存</div></div></td></tr>';
  } catch (e) { T.toast(e.message, 'err'); }
}
async function removePaper(id) {
  if (!await T.confirm('确定删除这份试卷？')) return;
  try { await T.api('/api/v1/teacher/papers/' + id, {method: 'DELETE'}); T.toast('已删除', 'ok'); loadPapers(); }
  catch (e) { T.toast(e.message, 'err'); }
}

if (T.token()) { initTaxonomy(); loadPapers(); } else { location.href = '/login?portal=teacher&next=%2Fteacher%2Fpapers'; }
</script>
</body>
</html>
