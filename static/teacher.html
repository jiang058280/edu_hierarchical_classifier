<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 · 教师门户</title>
<link rel="stylesheet" href="/static/edu.css">
</head>
<body>
<div id="shell"></div>
<div class="content">
  <div class="page-head"><h2>工作台</h2><p>题库、试卷与班级的整体概览</p></div>

  <div class="stat-grid">
    <div class="stat"><div class="k">题库总数</div><div class="v" id="stBank">—<small> 题</small></div></div>
    <div class="stat"><div class="k">试卷总数</div><div class="v" id="stPapers">—<small> 份</small></div></div>
    <div class="stat"><div class="k">我的班级</div><div class="v" id="stClasses">—<small> 个</small></div></div>
    <div class="stat"><div class="k">知识点树</div><div class="v" id="stNodes">—<small> 个</small></div></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><h3>快捷操作</h3></div>
    <div class="row">
      <a class="btn" href="/teacher/entry">AI 智能录入</a>
      <a class="btn ghost" href="/teacher/papers">去组卷</a>
      <a class="btn ghost" href="/teacher/assignments">发布作业</a>
      <a class="btn ghost" href="/teacher/bank">管理题库</a>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>我的班级</h3>
      <div class="row">
        <input class="input" type="text" id="clsName" placeholder="班级名，如 初三(2)班" style="width:170px">
        <select class="input" id="clsBand" style="width:90px"><option>初中</option><option>高中</option></select>
        <input class="input" type="text" id="clsGrade" placeholder="年级" style="width:90px">
        <button class="btn" onclick="createClass()">创建班级</button>
      </div>
    </div>
    <table class="table">
      <thead><tr><th>班级</th><th>学段 / 年级</th><th>入班邀请码</th><th>学生数</th><th>操作</th></tr></thead>
      <tbody id="classRows"></tbody>
    </table>
  </div>

  <div class="card" id="studentCard" style="display:none">
    <div class="card-head"><h3>学生名册 · <span id="studentClassName"></span></h3>
      <button class="btn plain sm" onclick="this.closest('.card').style.display='none'">收起</button></div>
    <table class="table">
      <thead><tr><th>姓名</th><th>用户名</th><th>学号</th><th>状态</th></tr></thead>
      <tbody id="studentRows"></tbody>
    </table>
  </div>
</div>
<script src="/static/teacher_common.js?v=20260909-h"></script>
<script>
const $ = (id) => document.getElementById(id);
T.renderShell('home', '工作台');

async function loadStats() {
  const [bank, papers, classes, nodes] = await Promise.all([
    T.api('/api/v1/teacher/questions?limit=1'),
    T.api('/api/v1/teacher/papers?limit=1'),
    T.api('/api/v1/teacher/classes'),
    T.api('/api/v1/teacher/knowledge-nodes'),
  ]);
  $('stBank').innerHTML = (bank.total || 0) + '<small> 题</small>';
  $('stPapers').innerHTML = (papers.total || 0) + '<small> 份</small>';
  $('stClasses').innerHTML = (classes.classes || []).length + '<small> 个</small>';
  $('stNodes').innerHTML = (nodes.total || 0) + '<small> 个</small>';
}

async function createClass() {
  const name = $('clsName').value.trim(), grade = $('clsGrade').value.trim();
  if (!name || !grade) { T.toast('请填写班级名和年级', 'err'); return; }
  try {
    const r = await T.api('/api/v1/teacher/classes', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, grade_band: $('clsBand').value, grade})
    });
    $('clsName').value = ''; $('clsGrade').value = '';
    T.toast('班级已创建，邀请码 ' + r.invite_code, 'ok');
    loadClasses();
  } catch (e) { T.toast(e.message, 'err'); }
}

async function loadClasses() {
  try {
    const data = await T.api('/api/v1/teacher/classes');
    $('classRows').innerHTML = data.classes.length ? data.classes.map(c => `
      <tr>
        <td><b>${T.escapeHtml(c.name)}</b></td>
        <td>${c.grade_band} / ${T.escapeHtml(c.grade)}</td>
        <td class="num" style="font-weight:700;color:var(--primary);letter-spacing:1px">${c.invite_code}</td>
        <td class="num">${c.student_count}</td>
        <td><button class="btn ghost sm" onclick="viewStudents(${c.id}, '${T.escapeHtml(c.name)}')">名册</button></td>
      </tr>`).join('')
      : '<tr><td colspan="5"><div class="empty"><div class="ico">🏫</div>还没有班级<div class="hint">创建班级后把邀请码发给学生，学生在学生门户即可加入</div></div></td></tr>';
  } catch (e) { T.toast(e.message, 'err'); }
}

async function viewStudents(classId, name) {
  try {
    const data = await T.api(`/api/v1/teacher/classes/${classId}/students`);
    $('studentCard').style.display = '';
    $('studentClassName').textContent = name;
    $('studentRows').innerHTML = data.students.length ? data.students.map(s => `
      <tr><td>${T.escapeHtml(s.real_name || '—')}</td><td>${T.escapeHtml(s.username)}</td>
      <td class="num">${T.escapeHtml(s.student_no || '—')}</td>
      <td>${s.is_active ? '<span class="badge b-ok">在班</span>' : '<span class="badge b-gray">停用</span>'}</td></tr>`).join('')
      : '<tr><td colspan="4" class="muted">暂无学生</td></tr>';
  } catch (e) { T.toast(e.message, 'err'); }
}

loadStats(); loadClasses();
</script>
</body>
</html>
