<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>班级学情 · 教师门户</title><link rel="stylesheet" href="/static/edu.css"></head>
<body><div id="shell"></div>
<main class="content insight-page">
  <div class="page-head"><h2>班级学情</h2><p>用已判分作答观察班级共性问题；样本不足时只呈现事实，不提前下结论。</p></div>
  <section class="card insight-toolbar">
    <label class="field"><span class="lbl">分析班级</span><select id="classSelect" class="input"><option value="">正在加载班级…</option></select></label>
    <button class="btn" id="analyticsBtn" onclick="loadAnalytics()">生成学情分析</button>
    <span class="muted" id="analyticsHint">数据来自学生最近的真实作答记录</span>
  </section>
  <div id="analytics"><section class="card"><div class="empty">请选择班级查看学情。</div></section></div>
</main>
<script src="/static/teacher_common.js?v=20260914-horizontal"></script>
<script>
const $=id=>document.getElementById(id),esc=T.escapeHtml;
T.renderShell('analytics','班级学情');
function heat(value){if(value===null||value===undefined)return '<span class="muted">暂无</span>';const pct=Math.round(value*100),bg=pct<50?'#FDECEC':pct<70?'#FFF4DB':'#E6F6EF',color=pct<50?'#C43D3D':pct<70?'#A76913':'#177B5A';return `<span class="heat" style="background:${bg};color:${color}">${pct}%</span>`}
function summaryCard(label,value,unit=''){return `<div class="stat"><div class="k">${label}</div><div class="v">${value}<small style="font-size:12px;font-weight:400;color:var(--muted);margin-left:3px">${unit}</small></div></div>`}
function renderAnalytics(data){
  const completion=data.completion||{},rate=completion.completion_rate==null?'—':Math.round(completion.completion_rate*100);
  const reteach=(data.reteach||[]),points=(data.matrix_points||[]),matrix=(data.matrix||[]),errors=(data.question_errors||[]);
  $('analytics').innerHTML=`
    <section class="stat-grid">${summaryCard('学生人数',data.students||0,'人')}${summaryCard('作业完成率',rate,rate==='—'?'':'%')}${summaryCard('需重讲知识点',reteach.length,'个')}${summaryCard('有记录知识点',points.length,'个')}</section>
    <section class="card insight-section"><div class="insight-section-head"><div><h3>需重讲清单</h3><p>仅列出达到系统阈值且有作答证据的共性薄弱点。</p></div><span class="badge ${reteach.length?'b-warn':'b-ok'}">${reteach.length?reteach.length+' 项待关注':'当前稳定'}</span></div>
      ${reteach.length?`<div class="reteach-list">${reteach.map(item=>`<article class="reteach-item"><div class="reteach-item-top"><b>${esc(item.subject)} · ${esc(item.knowledge_point)}</b><span class="badge b-warn">错误率 ${Math.round(item.error_rate*100)}%</span></div><p>${esc(item.evidence||'暂无补充证据')}</p></article>`).join('')}</div>`:'<div class="empty">当前没有达到“需重讲”阈值的知识点。</div>'}
    </section>
    <section class="card insight-section"><div class="insight-section-head"><div><h3>学生 × 知识点掌握矩阵</h3><p>颜色用于快速定位差异，悬停可查看作答次数。</p></div></div><div class="matrix-wrap"><table class="table"><thead><tr><th>学生</th>${points.map(point=>`<th>${esc(point)}</th>`).join('')}</tr></thead><tbody>${matrix.length?matrix.map(row=>`<tr><td><b>${esc(row.student_name)}</b></td>${row.scores.map(score=>`<td title="${score.attempt_count} 次作答">${heat(score.mastery_score)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${Math.max(1,points.length+1)}"><div class="empty">暂无可展示的画像数据。</div></td></tr>`}</tbody></table></div></section>
    <section class="card insight-section"><div class="insight-section-head"><div><h3>错误率较高题目</h3><p>结合知识点与样本数决定是否安排讲评。</p></div><span class="badge b-info">${errors.length} 题</span></div>
      ${errors.length?`<div class="data-table-wrap"><table class="table"><thead><tr><th>题目</th><th>知识点</th><th>作答人数</th><th>正确率</th></tr></thead><tbody>${errors.map(item=>`<tr><td>${esc(item.content).slice(0,90)}</td><td>${esc(item.knowledge_point||'未标注')}</td><td>${item.attempts}</td><td>${heat(item.correct_rate)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">暂无已判分作答记录。</div>'}
    </section>`;
}
async function loadClasses(){try{const data=await T.api('/api/v1/teacher/classes'),classes=data.classes||[];$('classSelect').innerHTML=classes.length?classes.map(item=>`<option value="${item.id}">${esc(item.name)} · ${esc(item.grade_band||'')}${esc(item.grade||'')}</option>`).join(''):'<option value="">暂无班级</option>';if(classes.length)loadAnalytics()}catch(error){T.toast(error.message,'err')}}
async function loadAnalytics(){const id=$('classSelect').value;if(!id)return;const button=$('analyticsBtn');button.disabled=true;button.textContent='正在分析…';$('analyticsHint').textContent='正在汇总作答与掌握度数据';try{const data=await T.api(`/api/v1/teacher/analytics/class/${id}`);renderAnalytics(data);$('analyticsHint').textContent='分析已更新'}catch(error){T.toast(error.message,'err');$('analyticsHint').textContent='读取失败，请稍后重试'}finally{button.disabled=false;button.textContent='生成学情分析'}}
if(T.token())loadClasses();else location.href='/login?portal=teacher&next=%2Fteacher%2Fanalytics';
</script></body></html>
