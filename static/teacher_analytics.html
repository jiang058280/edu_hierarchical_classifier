<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>班级学情 · 教师门户</title><link rel="stylesheet" href="/static/edu.css"><style>.heat{display:inline-block;min-width:52px;padding:5px 7px;border-radius:6px;text-align:center;font-size:12px}.matrix{overflow:auto}.matrix table{min-width:760px}</style></head><body><div id="shell"></div><main class="content"><div class="page-head"><h2>班级学情</h2><p>只展示你创建班级的数据；需重讲结论附带作答样本，避免以少量数据下判断。</p></div><section class="card" style="margin-bottom:16px"><div class="row"><label style="min-width:240px;flex:1">选择班级<select id="classSelect" class="input"></select></label><button class="btn" onclick="loadAnalytics()">查看分析</button></div></section><div id="analytics" class="muted">请选择班级后查看。</div></main><script src="/static/teacher_common.js?v=20260911-r36"></script><script>const $=id=>document.getElementById(id),esc=T.escapeHtml;T.renderShell('analytics','班级学情');function heat(v){if(v===null||v===undefined)return '<span class="muted">—</span>';let p=Math.round(v*100),c=p<50?'#fde7df':p<70?'#fff0cc':'#ddf2e8';return `<span class="heat" style="background:${c}">${p}%</span>`}async function loadClasses(){try{const d=await T.api('/api/v1/teacher/classes');$('classSelect').innerHTML=(d.classes||[]).map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.grade_band)}${esc(x.grade)}</option>`).join('')||'<option value="">暂无班级</option>';if(d.classes?.length)loadAnalytics()}catch(e){T.toast(e.message,'err')}}async function loadAnalytics(){const id=$('classSelect').value;if(!id)return;try{const d=await T.api(`/api/v1/teacher/analytics/class/${id}`),c=d.completion||{};$('analytics').innerHTML=`<section class="stat-grid"><div class="stat"><div class="k">学生人数</div><div class="v">${d.students}</div></div><div class="stat"><div class="k">作业完成率</div><div class="v">${c.completion_rate==null?'—':Math.round(c.completion_rate*100)+'%'}</div></div><div class="stat"><div class="k">需重讲知识点</div><div class="v">${d.reteach.length}</div></div></section><section class="card"><div class="card-head"><h3>需重讲清单</h3></div>${d.reteach.length?d.reteach.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--border)"><b>${esc(x.subject)} · ${esc(x.knowledge_point)}</b><span class="badge b-warn" style="margin-left:8px">错误率 ${Math.round(x.error_rate*100)}%</span><div class="muted" style="margin-top:4px">${esc(x.evidence)}</div></div>`).join(''):'<div class="empty">当前没有达到“需重讲”阈值的知识点。</div>'}</section><section class="card matrix"><div class="card-head"><h3>学生 × 知识点掌握矩阵</h3></div><table class="table"><thead><tr><th>学生</th>${d.matrix_points.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${d.matrix.map(row=>`<tr><td><b>${esc(row.student_name)}</b></td>${row.scores.map(x=>`<td title="${x.attempt_count} 次作答">${heat(x.mastery_score)}</td>`).join('')}</tr>`).join('')||'<tr><td class="muted">暂无可展示的画像数据</td></tr>'}</tbody></table></section><section class="card"><div class="card-head"><h3>错误率较高题目</h3></div>${d.question_errors.length?`<table class="table"><thead><tr><th>题目</th><th>知识点</th><th>作答</th><th>正确率</th></tr></thead><tbody>${d.question_errors.map(x=>`<tr><td>${esc(x.content).slice(0,70)}</td><td>${esc(x.knowledge_point||'—')}</td><td>${x.attempts}</td><td>${Math.round(x.correct_rate*100)}%</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无已判分作答记录。</div>'}</section>`}catch(e){T.toast(e.message,'err')}}loadClasses();</script></body></html>
