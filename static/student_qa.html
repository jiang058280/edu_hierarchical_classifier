<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识问答 · 知学课堂</title><link rel="stylesheet" href="/static/edu.css">
<style>
  .qa-layout{display:grid;grid-template-columns:244px minmax(0,1fr);gap:18px;min-height:calc(100vh - 155px)}
  .qa-sessions{padding:14px;align-self:start;position:sticky;top:88px}.qa-sessions h3{margin:0;font-size:15px}.qa-new{width:100%;margin:14px 0 8px}.qa-session{width:100%;display:block;text-align:left;border:0;background:transparent;border-radius:9px;padding:10px 11px;color:var(--text);cursor:pointer}.qa-session:hover,.qa-session.active{background:#edf2ff;color:#2857d9}.qa-session b,.qa-session span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qa-session b{font-size:13px;font-weight:600}.qa-session span{font-size:11px;color:var(--muted);margin-top:4px}.qa-empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:13px}.qa-main{min-width:0;display:flex;flex-direction:column}.qa-hero{padding:24px 28px;margin-bottom:14px;background:linear-gradient(135deg,#eff4ff 0%,#fff 70%);border:1px solid #dfe7f8}.qa-hero h2{font-size:22px;margin:3px 0 7px}.qa-hero p{margin:0;color:var(--muted);font-size:14px}.context-card{display:none;border:1px solid #d7e4ff;background:#f7faff;border-radius:11px;padding:13px 15px;margin-bottom:14px}.context-card.show{display:block}.context-label{font-size:12px;color:#3561c9;font-weight:700}.context-title{margin:5px 0;font-size:14px;font-weight:650}.context-text{font-size:13px;color:#53627c;line-height:1.7;white-space:pre-wrap}.qa-dialog{padding:16px 22px;min-height:380px}.qa-placeholder{margin:auto;padding:80px 10px;text-align:center;color:var(--muted)}.qa-placeholder b{display:block;color:var(--text);font-size:16px;margin:12px 0 5px}.bubble{max-width:86%;padding:13px 15px;margin:12px 0;border-radius:13px;line-height:1.75;font-size:14px;white-space:pre-wrap}.bubble.user{margin-left:auto;background:#335fe5;color:#fff;border-bottom-right-radius:4px}.bubble.assistant{background:#f5f7fb;color:#25334c;border-bottom-left-radius:4px}.bubble.refused{border:1px solid #f3cd92;background:#fffbf3}.citation-list{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}.citation{border:1px solid #cfdcf7;background:#fff;border-radius:6px;padding:5px 8px;color:#4662a6;font-size:12px}.answer-tools{display:flex;align-items:center;gap:8px;margin:8px 0 18px}.answer-tools .muted{font-size:12px}.qa-compose{padding:14px;position:sticky;bottom:16px;margin-top:auto;background:#fff;border:1px solid #dbe3f2;box-shadow:0 10px 30px rgba(38,64,115,.1)}.qa-compose textarea{resize:none;min-height:52px;line-height:1.65}.qa-compose-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.qa-compose-foot span{font-size:12px;color:var(--muted)}.qa-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.qa-actions button{font-size:12px}
  @media(max-width:820px){.qa-layout{grid-template-columns:1fr}.qa-sessions{position:static}.qa-sessions-list{display:flex;overflow:auto}.qa-session{min-width:165px}.qa-dialog{min-height:280px}.qa-hero{padding:20px}.bubble{max-width:94%}}
</style>
</head>
<body>
<div id="shell"></div>
<main class="content qa-layout">
  <aside class="card qa-sessions"><h3>问答记录</h3><button class="btn ghost sm qa-new" onclick="newConversation()">＋ 新建对话</button><div id="sessionList" class="qa-sessions-list"><div class="qa-empty">正在读取…</div></div></aside>
  <section class="qa-main">
    <div class="card qa-hero"><div class="eyebrow">学习助手</div><h2>围绕资料，解决一个具体问题</h2><p>回答会附带可核验的资料来源；证据不足时，助手会明确告诉你。</p><div class="qa-actions"><button class="btn ghost sm" type="button" onclick="askLearning('profile')">我的薄弱点</button><button class="btn ghost sm" type="button" onclick="askLearning('why_recommended')">为什么推荐这些题</button><button class="btn ghost sm" type="button" onclick="askLearning('study_priority')">我该先学什么</button><button class="btn ghost sm" type="button" onclick="enableSocratic()">启发式辅导</button></div></div>
    <div id="contextCard" class="context-card"></div>
    <div class="card qa-dialog" id="dialog"><div class="qa-placeholder"><div style="font-size:30px">⌁</div><b>从一个问题开始</b><span>可以问概念、方法，也可以从错题结果进入分析。</span></div></div>
    <form class="card qa-compose" id="composeForm"><textarea id="queryInput" class="input" rows="2" maxlength="1000" placeholder="例如：一次函数的图像怎样判断增减性？" aria-label="输入学习问题"></textarea><div id="contextActions" class="qa-actions" style="display:none"></div><div class="qa-compose-foot"><span id="composeHint">仅基于已发布、与你学段匹配的资料回答</span><button id="sendBtn" class="btn student" type="submit">发送</button></div></form>
  </section>
</main>
<script src="/static/student_common.js?v=20260910-r2"></script>
<script>
const $ = id => document.getElementById(id);
T2.renderShell('qa', '知识问答');
let activeSessionId = null, questionContext = null, pendingAction = null, learningAction = null, socraticMode = false, sending = false;

function formatTime(value) { return value ? String(value).replace('T', ' ').slice(0, 16) : ''; }
function safeText(value) { return T2.escapeHtml(value || ''); }
function citationHtml(items) { return !items || !items.length ? '' : `<div class="citation-list">${items.map(item => `<span class="citation">[${item.number || '来源'}] ${safeText(item.source_name)}${item.chapter ? ' · ' + safeText(item.chapter) : ''}${item.page_number ? ' · 第 ' + safeText(item.page_number) + ' 页' : ''}</span>`).join('')}</div>`; }
function answerTools(message) { return message.role !== 'assistant' ? '' : `<div class="answer-tools"><button class="btn ghost sm" onclick="feedback(${message.id},1,this)">有帮助</button><button class="btn ghost sm" onclick="feedback(${message.id},-1,this)">不准确</button><span class="muted">你的反馈将用于改进资料与回答质量</span></div>`; }
function appendMessage(message, stream = false) {
  const empty = $('dialog').querySelector('.qa-placeholder'); if (empty) empty.remove();
  const node = document.createElement('div'); node.className = `bubble ${message.role === 'assistant' ? 'assistant' : 'user'}${message.refused ? ' refused' : ''}`;
  node.dataset.messageId = message.id || '';
  node.innerHTML = `<div class="bubble-text">${safeText(message.content)}</div>${citationHtml(message.citations_json || message.citations)}${stream ? '' : answerTools(message)}`;
  $('dialog').appendChild(node); $('dialog').scrollTop = $('dialog').scrollHeight; return node;
}
function showContext(context) {
  questionContext = context || null; const card = $('contextCard');
  if (!context) { card.className = 'context-card'; card.innerHTML = ''; $('contextActions').style.display = 'none'; return; }
  card.className = 'context-card show'; card.innerHTML = `<div class="context-label">来自错题 · ${safeText(context.subject || '作业')}</div><div class="context-title">${safeText(context.assignment_title || '作业题目')} · ${safeText(context.question_type || '')}</div><div class="context-text">${safeText(context.content)}</div>`;
  $('contextActions').style.display = ''; $('contextActions').innerHTML = `<button class="btn ghost sm" type="button" onclick="askContext('why_wrong')">分析错因</button><button class="btn ghost sm" type="button" onclick="askContext('explain')">讲解知识点</button><button class="btn ghost sm" type="button" onclick="askContext('practice')">再练一题</button>`;
}
async function loadSessions() {
  try { const data = await T2.api('/api/v1/student/rag/sessions'); const items = data.items || [];
    $('sessionList').innerHTML = items.length ? items.map(item => `<button class="qa-session ${item.id === activeSessionId ? 'active' : ''}" onclick="openSession(${item.id})"><b>${safeText(item.title || '未命名对话')}</b><span>${formatTime(item.updated_at)}</span></button>`).join('') : '<div class="qa-empty">还没有问答记录</div>';
  } catch (error) { $('sessionList').innerHTML = `<div class="qa-empty">${safeText(error.message)}</div>`; }
}
async function openSession(id) {
  try { const data = await T2.api(`/api/v1/student/rag/sessions/${id}/messages`); activeSessionId = id; showContext(null); $('dialog').innerHTML = ''; (data.items || []).forEach(appendMessage); if (!data.items?.length) $('dialog').innerHTML = '<div class="qa-placeholder"><b>这是一个空对话</b></div>'; loadSessions(); }
  catch (error) { T2.toast(error.message, 'err'); }
}
function newConversation() { activeSessionId = null; showContext(null); $('dialog').innerHTML = '<div class="qa-placeholder"><div style="font-size:30px">⌁</div><b>开始新的学习问题</b><span>输入问题后，回答会自动保存在这里。</span></div>'; $('queryInput').focus(); loadSessions(); }
async function feedback(messageId, rating, button) { try { await T2.api(`/api/v1/student/rag/messages/${messageId}/feedback`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({rating})}); button.textContent = rating === 1 ? '已反馈' : '已记录'; button.disabled = true; T2.toast('感谢你的反馈', 'ok'); } catch (error) { T2.toast(error.message, 'err'); } }
function askContext(action) { pendingAction = action; $('queryInput').value = ''; sendQuestion(); }
function askLearning(action) { learningAction = action; const labels={profile:'请分析我的薄弱知识点。',why_recommended:'为什么系统推荐这些题？',study_priority:'我现在应该先学什么？'}; $('queryInput').value=labels[action]; sendQuestion(); }
function enableSocratic() { socraticMode=true; $('queryInput').placeholder='输入一道题或概念，我会先用问题引导你思考'; $('composeHint').textContent='启发式辅导已开启：先提示思路，不直接给完整答案'; $('queryInput').focus(); }
function parseSseBlock(block, onEvent) { const lines = block.split('\n'); let event = 'message', data = ''; lines.forEach(line => { if (line.startsWith('event:')) event = line.slice(6).trim(); if (line.startsWith('data:')) data += line.slice(5).trim(); }); if (data) onEvent(event, JSON.parse(data)); }
async function sendQuestion() {
  if (sending) return; const manual = $('queryInput').value.trim(); if (!questionContext && !manual) { T2.toast('请输入一个学习问题', 'err'); return; }
  const contextual = Boolean(questionContext && pendingAction), learning = Boolean(learningAction);
  const payload = contextual ? {session_id:activeSessionId, assignment_id:questionContext.assignment_id, question_id:questionContext.question_id, action:pendingAction} : {session_id:activeSessionId, query:manual, learning_action:learningAction||undefined, socratic:socraticMode};
  sending = true; $('sendBtn').disabled = true; $('sendBtn').textContent = '思考中…';
  appendMessage({role:'user', content:contextual ? ({why_wrong:'请分析这道题为什么会错。',explain:'请讲解这道题的知识点。',practice:'请给我一道同类练习题。'}[payload.action] || '请讲解这道题。') : manual}); $('queryInput').value = '';
  let assistantNode = null, fullAnswer = '', messageId = null, citations = [];
  try {
    const response = await fetch('/api/v1/student/rag/chat/stream', {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + T2.token()}, body:JSON.stringify(payload)});
    if (!response.ok || !response.body) { const data = await response.json().catch(() => ({})); throw new Error(data.detail || `问答请求失败（${response.status}）`); }
    const reader = response.body.getReader(), decoder = new TextDecoder(); let buffer = '';
    const handle = (event, data) => { if (event === 'session') { activeSessionId = data.session_id; messageId = data.message_id; } if (event === 'token') { fullAnswer += data.text; if (!assistantNode) assistantNode = appendMessage({role:'assistant', content:''}, true); assistantNode.querySelector('.bubble-text').textContent = fullAnswer; $('dialog').scrollTop = $('dialog').scrollHeight; } if (event === 'citations') citations = data.items || []; if (event === 'done') { if (!assistantNode) assistantNode = appendMessage({role:'assistant', content:'未获得可展示的回答。'}, true); assistantNode.classList.toggle('refused', Boolean(data.refused)); assistantNode.insertAdjacentHTML('beforeend', citationHtml(citations) + answerTools({id:messageId,role:'assistant'})); if (data.refused) T2.toast(data.reason || '资料证据不足，未生成自由回答', 'err'); } };
    for (;;) { const {value, done} = await reader.read(); buffer += decoder.decode(value || new Uint8Array(), {stream:!done}); let marker; while ((marker = buffer.indexOf('\n\n')) >= 0) { parseSseBlock(buffer.slice(0, marker), handle); buffer = buffer.slice(marker + 2); } if (done) break; }
    pendingAction = null; learningAction = null; socraticMode = false; $('composeHint').textContent='仅基于已发布、与你学段匹配的资料回答'; await loadSessions();
  } catch (error) { T2.toast(error.message, 'err'); if (!fullAnswer) $('dialog').lastElementChild?.remove(); }
  finally { sending = false; $('sendBtn').disabled = false; $('sendBtn').textContent = '发送'; }
}
$('composeForm').addEventListener('submit', event => { event.preventDefault(); sendQuestion(); });
$('queryInput').addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendQuestion(); } });
async function init() { if (!T2.token()) { location.href = '/login?portal=student&next=' + encodeURIComponent(location.pathname + location.search); return; } await loadSessions(); const params = new URLSearchParams(location.search); if (params.get('assignment_id') && params.get('question_id')) { try { const context = await T2.api(`/api/v1/student/rag/assignment-question-context?assignment_id=${encodeURIComponent(params.get('assignment_id'))}&question_id=${encodeURIComponent(params.get('question_id'))}`); showContext(context); pendingAction = params.get('action') || 'why_wrong'; askContext(pendingAction); } catch (error) { T2.toast(error.message, 'err'); } } }
init();
</script>
</body>
</html>
