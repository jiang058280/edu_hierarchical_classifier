<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能录入 · 教师门户</title>
<link rel="stylesheet" href="/static/edu.css">
</head>
<body>
<div id="shell"></div>
<div class="content">
  <div class="page-head"><h2>AI 智能录入</h2><p>粘贴题目后自动切分与三级标签预标注，逐题确认入库（人工确认结果会沉淀为高质量标注数据）</p></div>

  <div class="card">
    <h3>① 粘贴题目（支持多题，按题号自动切分）</h3>
    <textarea class="input" id="rawInput" rows="8" placeholder="示例：
1. 已知函数 f(x)=x²+1，求 f(2) 的值。
2. 下列关于细胞呼吸的叙述，正确的是（　　）
A．有氧呼吸的场所是线粒体
B．无氧呼吸不产生 ATP"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="splitAndPredict()">智能切分并预标注</button>
      <button class="btn plain" onclick="$('docxFile').click()">从文件导入</button>
      <input id="docxFile" type="file" accept=".docx,.pdf,.md,.markdown,.txt" hidden onchange="importDocx(this)">
      <button class="btn plain" onclick="resetAll()">清空</button>
      <span class="muted" id="splitInfo"></span>
      <span style="flex:1"></span>
      <span class="muted">单次最多 50 题</span>
    </div>
  </div>

  <div id="cards"></div>
  <div class="card" id="batchActions" style="display:none">
    <div class="card-head"><div><h3>② 本批快速处理</h3><p class="muted" id="batchSummary">将学段应用至全部待入库题目，再一次性确认。</p></div><span class="badge b-info" id="batchCount">0 题待处理</span></div>
    <div class="row" style="gap:10px;flex-wrap:wrap"><span class="muted">本批学段</span>
      <select class="input" id="batchGrade" style="width:132px"><option value="">不修改</option><option value="初中">初中</option><option value="高中">高中</option></select>
      <button class="btn plain sm" onclick="applyBatchGrade()">应用到本批</button><span style="flex:1"></span>
      <button class="btn ghost sm" id="saveAllDraft" onclick="saveAll('draft')">全部存草稿</button><button class="btn sm" id="saveAllPublished" onclick="saveAll('published')">一键全部入库</button>
    </div>
  </div>

  <div class="card" id="emptyCard" style="display:none">
    <div class="empty"><div class="ico">✂️</div>暂无待确认题目<div class="hint">粘贴题目后点击「智能切分并预标注」，AI 会给出学科、题型、知识点的三级预标注，教师逐题确认后入库。</div>
  </div>
</div>

<datalist id="kpCatalogList"></datalist>

<script src="/static/teacher_common.js?v=20260914-horizontal"></script>
<script>
const $ = (id) => document.getElementById(id);
T.renderShell('entry', 'AI 智能录入');
let taxonomy = null;
const NUM_START = /^\s*(\d{1,3})\s*(?:[.．、)]\s*|\|\s*)/;
const BRACKET_START = /^\s*[（(]\s*(\d{1,3})\s*[)）]\s*/;
let batchSeq = 0;

function typeOptions(subject, selected) {
  const names = [...((taxonomy && taxonomy.types_by_subject[subject]) || [])];
  if (selected && !names.includes(selected)) names.unshift(selected);
  return names.map(t => `<option ${t === selected ? 'selected' : ''}>${T.escapeHtml(t)}</option>`).join('');
}

function updateCardTypes(seq) {
  const subject = $('s_' + seq).value, type = $('ty_' + seq).value;
  $('ty_' + seq).innerHTML = typeOptions(subject, type);
  const weakHint = $('weak_' + seq);
  if (weakHint) weakHint.style.display = ['英语', '地理', '物理'].includes(subject) ? '' : 'none';
}

function splitQuestions(raw) {
  const lineBlocks = [], lines = String(raw || '').split(/\r?\n/);
  let current = [], expected = null;
  for (const line of lines) {
    const simple = line.match(NUM_START), bracket = line.match(BRACKET_START);
    const number = Number(simple?.[1] || bracket?.[1] || 0);
    // 仅连续题号可开启新题，避免 OCR 将公式中的 “2)” 当作题号。
    const startsNew = number && (expected === null || number === expected);
    if (startsNew && current.length) { lineBlocks.push(current.join(' ').trim()); current = [line]; expected = number + 1; }
    else { current.push(line); if (startsNew && expected === null) expected = number + 1; }
  }
  if (current.join('').trim()) lineBlocks.push(current.join(' ').trim());
  if (lineBlocks.length > 1) return lineBlocks.filter(block => block.length >= 8);

  const compact = T.cleanText(raw);
  const bySequentialLabels = (marker, numberAt) => {
    const starts = []; let match, expectedNumber = null;
    while ((match = marker.exec(compact)) !== null) {
      const number = Number(numberAt(match));
      if (!number || (expectedNumber !== null && number !== expectedNumber)) continue;
      starts.push(match.index + (match[1] || '').length);
      expectedNumber = number + 1;
    }
    return starts.length > 1 ? starts.map((start, index) => compact.slice(start, starts[index + 1] ?? compact.length).trim()).filter(block => block.length >= 8) : [];
  };
  // 高置信横向格式：1 | 题干 … | B 2 | 下一题。
  const pipeBlocks = bySequentialLabels(/(^|\s)(\d{1,3})\s*\|\s*/g, match => match[2]);
  if (pipeBlocks.length) return pipeBlocks;
  // 兼容横向连续编号：1. / 1、/ 1) / （1）。
  const inlineBlocks = bySequentialLabels(/(^|\s)(?:(\d{1,3})\s*[.．、)]|[（(]\s*(\d{1,3})\s*[)）])\s*/g, match => match[2] || match[3]);
  if (inlineBlocks.length) return inlineBlocks;
  return compact.length >= 8 ? [compact] : [];
}

function cardHtml(item) {
  // API 返回字段为 confidences；兼容早期前端曾使用的 conf，避免出现空白进度条。
  const conf = item.confidences || item.conf || {};
  const number = (v) => Math.max(0, Math.min(1, Number(v) || 0));
  const level = (v) => number(v) >= .80 ? ['可信', 'b-ok', '#0D9488'] : number(v) >= .60 ? ['建议确认', 'b-warn', '#D97706'] : ['需复核', 'b-bad', '#DC2626'];
  const meter = (label, value) => {
    const pct = Math.round(number(value) * 100), meta = level(value);
    return `<span style="display:inline-flex;align-items:center;gap:5px;white-space:nowrap"><span>${label}</span><b style="color:${meta[2]}">${pct}%</b><span style="display:inline-block;width:52px;height:5px;border-radius:3px;background:#EDF0F7"><span style="display:block;height:5px;border-radius:3px;background:${meta[2]};width:${pct}%"></span></span></span>`;
  };
  const average = (number(conf.subject) + number(conf.question_type) + number(conf.knowledge_point)) / 3;
  const averageMeta = level(average);
  const opts = ['A','B','C','D'];
  return `
  <div class="card qcard" id="qc_${item.seq}">
    <div class="card-head">
      <h3>第 ${item.seq + 1} 题 <span class="badge b-info">AI 预标注</span></h3>
      <div class="row" style="gap:12px;justify-content:flex-end;flex-wrap:wrap;font-size:12px;color:var(--muted)">
        <span class="badge ${averageMeta[1]}">综合 ${Math.round(average * 100)}% · ${averageMeta[0]}</span>
        ${meter('学科', conf.subject)}${meter('题型', conf.question_type)}${meter('知识点', conf.knowledge_point)}
      </div>
    </div>
    <textarea class="input" id="t_${item.seq}" rows="4">${T.escapeHtml(item.text)}</textarea>
    <div class="grid2" style="margin-top:10px">
      <div class="field"><label class="lbl">学科</label>
        <select class="input" id="s_${item.seq}" onchange="updateCardTypes(${item.seq})">${taxonomy.subjects.map(s => `<option ${s === item.subject ? 'selected' : ''}>${s}</option>`).join('')}</select>
        <div class="hint" id="weak_${item.seq}" style="display:${['英语', '地理', '物理'].includes(item.subject) ? '' : 'none'};color:#b45309;font-size:12px">模型对该学科预标注较弱（题库实测 0.84-0.89），请重点核对学科与知识点</div></div>
      <div class="field"><label class="lbl">题型</label>
        <select class="input" id="ty_${item.seq}">${typeOptions(item.subject, item.question_type)}</select></div>
      <div class="field"><label class="lbl">知识点</label>
        <input class="input" id="k_${item.seq}" list="kpCatalogList" value="${T.escapeHtml(item.knowledge_point || '')}" placeholder="例如：三角函数"></div>
      <div class="field"><label class="lbl">学段</label>
        <select class="input" id="g_${item.seq}"><option value="">—</option>${['初中','高中'].map(g => `<option ${g === item.grade_band ? 'selected' : ''}>${g}</option>`).join('')}</select></div>
      <div class="field"><label class="lbl">参考答案（可空）</label>
        <input class="input" id="a_${item.seq}" value="${T.escapeHtml(item.answer || '')}" placeholder="原文答案会自动回填"></div>
      <div class="field"><label class="lbl">难度</label>
        <select class="input" id="d_${item.seq}"><option value="">—</option>${[1,2,3,4,5].map(n => `<option ${n === item.difficulty ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      <div class="field" style="grid-column:1/-1"><label class="lbl">解析（可空）</label><textarea class="input" id="an_${item.seq}" rows="2" placeholder="原文解析会自动回填">${T.escapeHtml(item.analysis || '')}</textarea></div>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost sm" onclick="removeCard(${item.seq})">丢弃</button>
      <button class="btn sm" onclick="saveCard(${item.seq}, 'published')">确认入库</button>
      <button class="btn ghost sm" onclick="saveCard(${item.seq}, 'draft')">存为草稿</button>
    </div>
  </div>`;
}

async function splitAndPredict() {
  if (!taxonomy) {
    try { taxonomy = await T.api('/api/v1/teacher/question-taxonomy'); }
    catch (e) { T.toast(e.message, 'err'); return; }
  }
  const raw = $('rawInput').dataset.sourceText || $('rawInput').value;
  if (!raw.trim()) { T.toast('请先粘贴题目', 'err'); return; }
  const texts = splitQuestions(raw);
  $('splitInfo').textContent = `切分出 ${texts.length} 题`;

  if (!texts.length) { $('cards').innerHTML = ''; $('emptyCard').style.display = ''; return; }
  try {
    const data = await T.api('/api/v1/teacher/questions/classify-batch', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ texts: texts.slice(0, 50) })
    });
    renderPredictions(data.items || []);
  } catch (e) { T.toast(e.message, 'err'); }
}

function renderPredictions(items) {
  batchSeq = 0;
  $('cards').innerHTML = '';
  $('emptyCard').style.display = items.length ? 'none' : '';
  items.forEach(item => {
    item.seq = batchSeq++;
    const div = document.createElement('div');
    div.innerHTML = cardHtml(item);
    $('cards').appendChild(div.firstElementChild);
  });
  $('batchActions').style.display = items.length ? '' : 'none';
  $('batchCount').textContent = `${items.length} 题待处理`;
  if (items.length) T.toast(`预标注完成，共 ${items.length} 题，可批量设置学段并一键入库`, 'ok');
}

async function importDocx(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (!taxonomy) {
    try { taxonomy = await T.api('/api/v1/teacher/question-taxonomy'); }
    catch (e) { T.toast(e.message, 'err'); return; }
  }
  $('splitInfo').textContent = `正在读取 ${file.name}…`;
  const form = new FormData(); form.append('file', file);
  try {
    const data = await T.api('/api/v1/teacher/questions/import-file', {method: 'POST', body: form});
    $('splitInfo').textContent = `从 ${file.name} 切分出 ${data.total} 题`;
    renderPredictions(data.items || []);
  } catch (e) {
    $('splitInfo').textContent = '';
    T.toast(e.message, 'err');
  }
}

function collect(seq) {
  const text = $('t_' + seq).value.trim();
  if (text.length < 10) { T.toast('第 ' + (seq + 1) + ' 题题干过短', 'err'); return null; }
  return {
    text,
    subject: $('s_' + seq).value,
    question_type: $('ty_' + seq).value,
    knowledge_point: $('k_' + seq).value.trim(),
    grade_band: $('g_' + seq).value,
    answer: $('a_' + seq).value.trim(),
    analysis: $('an_' + seq).value.trim(),
    difficulty: $('d_' + seq).value ? parseInt($('d_' + seq).value) : null,
    status: 'published',
  };
}

async function saveCard(seq, status) {
  const payload = collect(seq);
  if (!payload) return;
  payload.status = status;
  try {
    const r = await T.api('/api/v1/teacher/questions', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    markSavedCard(seq);
    T.toast('题目已入库', 'ok');
  } catch (e) { T.toast(e.message, 'err'); }
}

function removeCard(seq) {
  const card = document.getElementById('qc_' + seq);
  card.remove();
  if (!$('cards').children.length) { $('emptyCard').style.display = ''; $('batchActions').style.display = 'none'; }
}

function resetAll() {
  $('rawInput').value = ''; $('cards').innerHTML = '';
  delete $('rawInput').dataset.sourceText;
  $('splitInfo').textContent = ''; $('emptyCard').style.display = 'none'; $('batchActions').style.display = 'none';
}

function pendingCards() { return [...document.querySelectorAll('.qcard')].filter(card => !card.dataset.saved); }

function applyBatchGrade() {
  const gradeBand = $('batchGrade').value;
  if (!gradeBand) { T.toast('请先选择初中或高中', 'err'); return; }
  const cards = pendingCards();
  cards.forEach(card => { $('g_' + card.id.replace('qc_', '')).value = gradeBand; });
  T.toast(`已将 ${gradeBand} 应用到 ${cards.length} 题`, 'ok');
}

function markSavedCard(seq) {
  const card = document.getElementById('qc_' + seq);
  if (!card) return;
  card.dataset.saved = 'true'; card.style.opacity = '.45';
  card.querySelectorAll('button').forEach(button => button.disabled = true);
  card.querySelector('.card-head h3').innerHTML = `第 ${Number(seq) + 1} 题 <span class="badge b-ok">已入库</span>`;
}

async function saveAll(status) {
  const cards = pendingCards();
  if (!cards.length) { T.toast('没有待入库题目', 'err'); return; }
  const items = [];
  for (const card of cards) {
    const payload = collect(Number(card.id.replace('qc_', '')));
    if (!payload) return;
    payload.status = status; items.push(payload);
  }
  const buttons = [$('saveAllDraft'), $('saveAllPublished')];
  buttons.forEach(button => button.disabled = true);
  $('batchSummary').textContent = `正在保存 ${items.length} 题…`;
  try {
    const result = await T.api('/api/v1/teacher/questions/batch', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({items})});
    result.created.forEach(item => markSavedCard(cards[item.index].id.replace('qc_', '')));
    $('batchSummary').textContent = `已完成：成功保存 ${result.total} 题。`;
    $('batchCount').textContent = '本批已处理';
    T.toast(`已成功${status === 'draft' ? '保存草稿' : '入库'} ${result.total} 题`, 'ok');
  } catch (e) {
    $('batchSummary').textContent = '批量保存未完成，请根据提示检查后重试。'; T.toast(e.message, 'err');
  } finally { buttons.forEach(button => button.disabled = false); }
}

// 显示保持横向；原始粘贴内容只用于按题号精确切分。
$('rawInput').addEventListener('paste', (event) => {
  const text = event.clipboardData?.getData('text/plain') || '';
  if (!event.target.value && text) event.target.dataset.sourceText = text;
}, true);
$('rawInput').addEventListener('input', (event) => {
  const source = event.target.dataset.sourceText;
  if (source && T.cleanText(source) !== event.target.value) delete event.target.dataset.sourceText;
});

if (T.token()) {
  T.api('/api/v1/teacher/question-taxonomy').then(data => { taxonomy = data; })
    .catch(e => T.toast(e.message, 'err'));
  T.api('/api/v1/teacher/knowledge-catalog').then(data => {
    $('kpCatalogList').innerHTML = (data.subjects || []).flatMap(subject =>
      (subject.points || []).map(point =>
        `<option value="${T.escapeHtml(point.knowledge_point)}" label="${subject.subject}">`)).join('');
  }).catch(() => {});
} else { location.href = '/login?portal=teacher&next=%2Fteacher%2Fentry'; }
</script>
</body>
</html>
