<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生门户 · 智慧教研平台</title>
<link rel="stylesheet" href="/static/edu.css">
<style>
  body { background: var(--bg); }
  .sidebar { background: linear-gradient(180deg, #123F3B 0%, #0D9488 130%); border-right: none; }
  .sidebar .logo .name { color: #fff; }
  .sidebar .logo .name small { color: rgba(255,255,255,.6); }
  .sidebar .nav a { color: rgba(255,255,255,.82); }
  .sidebar .nav a:hover { background: rgba(255,255,255,.1); color: #fff; }
  .sidebar .nav a.active { background: rgba(255,255,255,.16); color: #fff; }
  .sidebar .foot { color: rgba(255,255,255,.65); border-top-color: rgba(255,255,255,.15); }
  .card { border-top: 3px solid #0D9488; }
</style>
</head>
<body>
<div id="shell"></div>
<div class="content" style="max-width:720px">
  <div class="page-head"><h2>我的学习</h2><p>加入班级后即可查看并完成老师布置的作业</p></div>

  <div class="card">
    <h3>加入班级</h3>
    <div class="row">
      <input class="input" type="text" id="inviteCode" placeholder="输入老师给的 6 位邀请码" maxlength="6" style="flex:1">
      <button class="btn" onclick="joinClass()" style="background:#0D9488">加 入</button>
    </div>
    <div class="err" id="joinErr"></div>
  </div>

  <div class="card" id="classCard" style="display:none">
    <h3>我的班级</h3>
    <div id="classInfo"></div>
  </div>

  <div class="card">
    <h3>我的作业</h3>
    <div style="background:#FFFBEB;border:1px dashed #F0C36D;color:#92400E;border-radius:8px;padding:12px 14px;font-size:13px">
      在线作答将在平台 M2 上线；届时作业会出现在这里，作答后自动判分并沉淀错题本。
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const TOKEN_KEY = 'edu_token_student';
const T2 = {
  token() { return localStorage.getItem(TOKEN_KEY) || ''; },
  setToken(t) { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); },
  async api(path, options) {
    const headers = Object.assign({}, (options && options.headers) || {});
    if (this.token()) headers['Authorization'] = 'Bearer ' + this.token();
    const resp = await fetch(path, Object.assign({}, options, { headers }));
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      if (resp.status === 401) {
        this.setToken('');
        location.href = '/login?portal=student';
        throw new Error('登录已过期');
      }
      throw new Error(data.error || data.detail || (resp.status + ' ' + resp.statusText));
    }
    return data;
  },
  escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
};

document.getElementById('shell').innerHTML = `
  <div class="sidebar">
    <div class="logo">
      <div class="mark" style="background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
      </div>
      <div class="name">学生门户<small>STUDENT</small></div>
    </div>
    <div class="nav">
      <a class="active" href="/student">我的学习</a>
    </div>
    <div class="foot">智慧教研平台</div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="crumb">学生门户 / <b>我的学习</b></div>
      <div class="right"><span id="shellUser"></span></div>
    </div>
  </div>`;

async function loadIdentity() {
  try {
    const me = await T2.api('/api/v1/auth/me');
    $('shellUser').innerHTML =
      `<div class="avatar" style="background:#D9F2EE;color:#0D9488">${T2.escapeHtml((me.real_name || me.username).slice(0, 1))}</div>
       <span>${T2.escapeHtml(me.real_name || me.username)}</span>
       <a href="/login?portal=student" onclick="T2.setToken('')" style="font-size:12px;color:var(--muted)">退出</a>`;
    return true;
  } catch (e) { return false; }
}
function logout() { T2.setToken(''); location.href = '/login?portal=student'; }

async function joinClass() {
  $('joinErr').textContent = '';
  try {
    const r = await T2.api('/api/v1/student/join-class', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ invite_code: $('inviteCode').value.trim() })
    });
    $('inviteCode').value = '';
    showClass(r.class);
  } catch (e) { $('joinErr').textContent = e.message; }
}
function showClass(c) {
  if (!c) { $('classCard').style.display = 'none'; return; }
  $('classCard').style.display = '';
  $('classInfo').innerHTML = `
    <div class="kv"><span>班级</span><b>${T2.escapeHtml(c.name)}</b></div>
    <div class="kv"><span>学段 / 年级</span><b>${T2.escapeHtml(c.grade_band)} · ${T2.escapeHtml(c.grade)}</b></div>`;
}
async function loadMyClass() {
  try {
    const data = await T2.api('/api/v1/student/my-class');
    showClass(data.class);
  } catch (e) { /* 401 已跳登录 */ }
}

if (T2.token()) { loadIdentity().then(() => loadMyClass()); }
else { location.href = '/login?portal=student'; }
</script>
</body>
</html>
