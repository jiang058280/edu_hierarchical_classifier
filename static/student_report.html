<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习报告 · 知学课堂</title><link rel="stylesheet" href="/static/edu.css"></head><body><div id="shell"></div><main class="content" style="max-width:1120px"><div class="page-head"><h2>学习报告</h2><p>基于已判分作答与重练记录生成；样本较少时请把结果视为初步信号。</p></div><section class="stat-grid" id="summary"><div class="stat"><div class="k">已分析知识点</div><div class="v">—</div></div><div class="stat"><div class="k">当前薄弱点</div><div class="v">—</div></div><div class="stat"><div class="k">画像可信度</div><div class="v">—</div></div></section><section class="card"><div class="card-head"><div><h3>知识点掌握度</h3><p class="muted">点击“专项练习”可跳转到相应练习。</p></div><button class="btn plain sm" onclick="loadReport()">刷新报告</button></div><div id="reportList" class="muted">正在分析…</div></section></main><script src="/static/student_common.js?v=20260911-r36"></script><script>const $=id=>document.getElementById(id),esc=T2.escapeHtml;T2.renderShell('report','学习报告');function confidence(items){if(!items.length)return '证据不足';let n=items.reduce((s,x)=>s+(x.attempt_count||0),0)/items.length;return n>=5?'较高':n>=2?'中等':'初步'}async function loadReport(){try{const d=await T2.api('/api/v1/student/analytics/me'),items=d.items||[],weak=d.weak_points||[];$('summary').innerHTML=`<div class="stat"><div class="k">已分析知识点</div><div class="v">${items.length}</div></div><div class="stat"><div class="k">当前薄弱点</div><div class="v">${weak.length}</div></div><div class="stat"><div class="k">画像可信度</div><div class="v">${confidence(items)}</div></div>`;$('reportList').innerHTML=items.length?items.map(x=>`<article style="display:grid;grid-template-columns:minmax(150px,1fr) 2fr 100px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)"><div><b>${esc(x.knowledge_point)}</b><div class="muted" style="font-size:12px;margin-top:4px">${esc(x.subject)} · ${x.attempt_count} 次作答</div></div><div><div style="height:9px;border-radius:8px;background:#e9eef8"><span style="display:block;height:9px;border-radius:8px;width:${Math.round(x.mastery_score*100)}%;background:${x.mastery_score<.5?'#df7d55':x.mastery_score<.7?'#d7a333':'#39a17b'}"></span></div><small class="muted">总体正确率 ${Math.round(x.correct_rate*100)}% · 近期 ${Math.round(x.recent_correct_rate*100)}% · 可信度 ${Math.round(x.profile_confidence*100)}%</small></div><a class="btn ghost sm" href="/student/wrong-book">专项练习</a></article>`).join(''):'<div class="empty">还没有可分析的已判分作答。完成作业或练习后再来看看。</div>'}catch(e){$('reportList').textContent=e.message}}if(T2.token())loadReport();else location.href='/login?portal=student&next=%2Fstudent%2Freport';</script></body></html>
