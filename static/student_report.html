<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习报告 · 知学课堂</title><link rel="stylesheet" href="/static/edu.css"></head>
<body><div id="shell"></div>
<main class="content student-dashboard">
  <header class="dashboard-intro"><div><div class="eyebrow">个人学习数据</div><h2>我的学习报告</h2><p>根据已判分作答与重练记录更新，样本较少时仅作为初步参考。</p></div><button class="btn plain sm" id="reportRefresh" onclick="loadReport()">更新报告</button></header>
  <section class="summary-grid" id="summary">
    <div class="summary-tile"><div class="summary-label">已分析知识点</div><div class="summary-value">—</div></div><div class="summary-tile"><div class="summary-label">当前薄弱点</div><div class="summary-value">—</div></div><div class="summary-tile"><div class="summary-label">画像可信度</div><div class="summary-value">—</div></div><div class="summary-tile"><div class="summary-label">建议下一步</div><div class="summary-value" style="font-size:15px;margin-top:10px">正在计算</div></div>
  </section>
  <section class="card dashboard-panel">
    <div class="dashboard-panel-head"><div><h3>知识点掌握度</h3><p class="muted" style="margin-top:3px;font-size:12px">综合整体正确率、近期表现和重练结果。</p></div><span class="badge b-info" id="pointCount">等待分析</span></div>
    <div class="mastery-list" id="reportList" style="padding:0 20px"><div class="dashboard-empty"><b>正在整理学习记录…</b></div></div>
  </section>
</main>
<script src="/static/student_common.js?v=20260914-assignments-route"></script>
<script>
const $=id=>document.getElementById(id),esc=T2.escapeHtml;
T2.renderShell('report','学习报告');
function confidence(items){if(!items.length)return '证据不足';const average=items.reduce((sum,item)=>sum+(item.attempt_count||0),0)/items.length;return average>=5?'较高':average>=2?'中等':'初步'}
function color(score){return score<.5?'#D95F4F':score<.7?'#D59A2A':'#27866A'}
function render(items,weak){const trust=confidence(items),next=weak.length?'巩固薄弱点':items.length?'保持练习':'先完成作业';$('summary').innerHTML=`<div class="summary-tile"><div class="summary-label">已分析知识点</div><div class="summary-value">${items.length}<small>个</small></div></div><div class="summary-tile"><div class="summary-label">当前薄弱点</div><div class="summary-value">${weak.length}<small>个</small></div></div><div class="summary-tile"><div class="summary-label">画像可信度</div><div class="summary-value" style="font-size:20px">${trust}</div></div><div class="summary-tile"><div class="summary-label">建议下一步</div><div class="summary-value" style="font-size:15px;margin-top:9px">${next}</div></div>`;$('pointCount').textContent=`${items.length} 个知识点`;$('reportList').innerHTML=items.length?items.map(item=>{const pct=Math.round(item.mastery_score*100);return `<article class="mastery-row"><div><div class="mastery-name">${esc(item.knowledge_point)}</div><div class="mastery-meta">${esc(item.subject)} · ${item.attempt_count} 次有效作答</div></div><div><div class="mastery-score"><span>掌握度</span><b>${pct}%</b></div><div class="progress-track"><span style="width:${pct}%;background:${color(item.mastery_score)}"></span></div><div class="mastery-meta">总体正确率 ${Math.round(item.correct_rate*100)}% · 近期 ${Math.round(item.recent_correct_rate*100)}% · 证据可信度 ${Math.round(item.profile_confidence*100)}%</div></div><a class="btn ghost sm" href="/student/wrong-book">专项练习</a></article>`}).join(''):'<div class="dashboard-empty"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19V5M8 19v-7M12 19V9M16 19V4M20 19v-11"/></svg><b>还没有足够的学习记录</b><span>完成作业或专项练习后，这里会形成你的掌握度画像。</span></div>'}
async function loadReport(){const button=$('reportRefresh');button.disabled=true;button.textContent='更新中…';try{const data=await T2.api('/api/v1/student/analytics/me');render(data.items||[],data.weak_points||[])}catch(error){$('reportList').innerHTML=`<div class="dashboard-empty"><b>${esc(error.message)}</b><span>请稍后重新加载。</span></div>`}finally{button.disabled=false;button.textContent='更新报告'}}
if(T2.token())loadReport();else location.href='/login?portal=student&next=%2Fstudent%2Freport';
</script></body></html>
