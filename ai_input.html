<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧教研平台 - AI智能录入</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #f3f4f6;
    }

    /* 重新分类图标按钮：悬浮旋转 360° */
    .refresh-btn .fa-arrows-rotate {
      transition: transform 0.6s ease;
    }
    .refresh-btn:hover .fa-arrows-rotate {
      transform: rotate(360deg);
    }

    /* 进度条过渡动画 */
    .progress-bar {
      transition: all 0.5s ease;
    }

    /* 快捷示例标签悬浮上浮 */
    .tag-pill {
      transition: all 0.2s ease;
    }
    .tag-pill:hover {
      transform: translateY(-2px);
    }

    /* 按钮统一悬浮上浮 */
    .btn-hover {
      transition: all 0.2s ease;
    }
    .btn-hover:hover {
      transform: translateY(-2px);
    }

    /* 维度行悬浮高亮 */
    .dim-row {
      transition: background-color 0.2s ease;
    }
    .dim-row:hover {
      background-color: #f9fafb;
    }
  </style>
</head>
<body class="min-h-screen py-8">
  <div class="max-w-[1200px] mx-auto px-6">

    <!-- ===================== 区域一：顶部导航与输入区 ===================== -->
    <section class="mb-6">
      <!-- 面包屑导航 -->
      <nav class="flex items-center text-sm text-gray-500 mb-5">
        <i class="fas fa-graduation-cap text-indigo-500 mr-2"></i>
        <span>智慧教研平台</span>
        <i class="fas fa-chevron-right text-[10px] mx-3 text-gray-300"></i>
        <span>题库管理</span>
        <i class="fas fa-chevron-right text-[10px] mx-3 text-gray-300"></i>
        <span class="text-gray-800 font-semibold">AI智能录入</span>
      </nav>

      <!-- 输入卡片 -->
      <div class="bg-white rounded-2xl shadow-md p-8">
        <label class="block text-sm font-semibold text-gray-700 mb-3">
          <i class="fas fa-pen-to-square text-indigo-600 mr-2"></i>题目输入
        </label>
        <textarea
          class="w-full h-[100px] p-4 border border-gray-200 rounded-xl resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-gray-700 leading-relaxed"
          placeholder="请输入或粘贴题目文本..."
        >下列句子中，没有语病的一项是（）</textarea>

        <!-- 快捷示例标签 -->
        <div class="mt-4">
          <div class="text-xs text-gray-400 mb-2 uppercase tracking-wider">快捷示例</div>
          <div class="flex flex-wrap gap-2">
            <button class="tag-pill px-4 py-1.5 text-sm bg-gray-50 text-gray-600 border border-gray-200 rounded-full hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300">语文</button>
            <button class="tag-pill px-4 py-1.5 text-sm bg-gray-50 text-gray-600 border border-gray-200 rounded-full hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300">数学</button>
            <button class="tag-pill px-4 py-1.5 text-sm bg-gray-50 text-gray-600 border border-gray-200 rounded-full hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300">英语</button>
            <button class="tag-pill px-4 py-1.5 text-sm bg-gray-50 text-gray-600 border border-gray-200 rounded-full hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300">物理</button>
            <button class="tag-pill px-4 py-1.5 text-sm bg-gray-50 text-gray-600 border border-gray-200 rounded-full hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300">化学</button>
            <button class="tag-pill px-4 py-1.5 text-sm bg-gray-50 text-gray-600 border border-gray-200 rounded-full hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300">生物</button>
            <button class="tag-pill px-4 py-1.5 text-sm bg-gray-50 text-gray-600 border border-gray-200 rounded-full hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300">历史</button>
            <button class="tag-pill px-4 py-1.5 text-sm bg-gray-50 text-gray-600 border border-gray-200 rounded-full hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300">地理</button>
            <button class="tag-pill px-4 py-1.5 text-sm bg-gray-50 text-gray-600 border border-gray-200 rounded-full hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-300">政治</button>
          </div>
        </div>

        <!-- 操作按钮组 -->
        <div class="flex justify-end items-center gap-3 mt-5">
          <button class="btn-hover px-5 py-2 text-sm text-gray-500 border border-gray-300 rounded-lg hover:bg-gray-50 hover:text-gray-700 hover:border-gray-400">
            <i class="fas fa-eraser mr-1.5"></i>清空
          </button>
          <button class="btn-hover px-6 py-2 text-sm text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 hover:shadow-lg shadow-md">
            <i class="fas fa-rocket mr-1.5"></i>开始分类
          </button>
        </div>
      </div>
    </section>

    <!-- ===================== 区域二：分类结果展示区（核心卡片） ===================== -->
    <section class="bg-white rounded-2xl shadow-md p-8 mb-6">

      <!-- 卡片标题 -->
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-bold text-gray-800">
          <i class="fas fa-layer-group text-indigo-500 mr-2"></i>分类结果
        </h2>
        <span class="text-xs text-gray-400">
          <i class="far fa-clock mr-1"></i>2026-08-17 14:32
        </span>
      </div>

      <!-- 1. 整体置信度 -->
      <div class="mb-8">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-baseline gap-3">
            <span class="text-5xl font-bold text-emerald-500">97.2<span class="text-2xl">%</span></span>
            <span class="text-sm text-gray-500">平均置信度</span>
          </div>
          <div class="flex items-center gap-2 text-xs text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full">
            <i class="fas fa-circle-check"></i>
            <span>分类完成 · 高置信度</span>
          </div>
        </div>
        <div class="w-full h-3 bg-gray-100 rounded-full overflow-hidden">
          <div class="progress-bar h-full bg-emerald-500 rounded-full" style="width: 97.2%"></div>
        </div>
      </div>

      <!-- 2. 三维度分类结果 -->
      <div class="space-y-1">
        <div class="text-xs text-gray-400 mb-3 uppercase tracking-wider">三维度分类详情</div>

        <!-- 学科 -->
        <div class="dim-row flex items-center gap-4 py-4 rounded-lg px-3">
          <div class="flex items-center gap-2 w-24">
            <div class="w-8 h-8 flex items-center justify-center bg-indigo-50 rounded-lg">
              <i class="fas fa-book text-indigo-500 text-sm"></i>
            </div>
            <span class="text-sm font-medium text-gray-600">学科</span>
          </div>
          <div class="text-base font-bold text-gray-800 min-w-[120px]">语文</div>
          <div class="flex-1 flex items-center gap-3">
            <div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">
              <div class="progress-bar h-full bg-emerald-500 rounded-full" style="width: 98%"></div>
            </div>
            <span class="text-sm font-bold text-gray-700 w-12 text-right">98%</span>
          </div>
          <button class="refresh-btn w-9 h-9 flex items-center justify-center text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors duration-200" title="重新分类此维度">
            <i class="fas fa-arrows-rotate text-sm"></i>
          </button>
        </div>

        <!-- 题型 -->
        <div class="dim-row flex items-center gap-4 py-4 rounded-lg px-3">
          <div class="flex items-center gap-2 w-24">
            <div class="w-8 h-8 flex items-center justify-center bg-amber-50 rounded-lg">
              <i class="fas fa-list-check text-amber-500 text-sm"></i>
            </div>
            <span class="text-sm font-medium text-gray-600">题型</span>
          </div>
          <div class="text-base font-bold text-gray-800 min-w-[120px]">选择题</div>
          <div class="flex-1 flex items-center gap-3">
            <div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">
              <div class="progress-bar h-full bg-emerald-500 rounded-full" style="width: 97%"></div>
            </div>
            <span class="text-sm font-bold text-gray-700 w-12 text-right">97%</span>
          </div>
          <button class="refresh-btn w-9 h-9 flex items-center justify-center text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors duration-200" title="重新分类此维度">
            <i class="fas fa-arrows-rotate text-sm"></i>
          </button>
        </div>

        <!-- 知识点 -->
        <div class="dim-row flex items-center gap-4 py-4 rounded-lg px-3">
          <div class="flex items-center gap-2 w-24">
            <div class="w-8 h-8 flex items-center justify-center bg-cyan-50 rounded-lg">
              <i class="fas fa-lightbulb text-cyan-500 text-sm"></i>
            </div>
            <span class="text-sm font-medium text-gray-600">知识点</span>
          </div>
          <div class="text-base font-bold text-gray-800 min-w-[120px]">古代汉语知识</div>
          <div class="flex-1 flex items-center gap-3">
            <div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">
              <div class="progress-bar h-full bg-emerald-500 rounded-full" style="width: 97%"></div>
            </div>
            <span class="text-sm font-bold text-gray-700 w-12 text-right">97%</span>
          </div>
          <button class="refresh-btn w-9 h-9 flex items-center justify-center text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors duration-200" title="重新分类此维度">
            <i class="fas fa-arrows-rotate text-sm"></i>
          </button>
        </div>
      </div>

      <!-- 3. 人工反馈与操作栏 -->
      <div class="mt-6 pt-6 border-t-2 border-gray-100 flex items-center justify-between flex-wrap gap-4">
        <!-- 左侧：反馈 -->
        <div class="flex items-center gap-3 flex-wrap">
          <span class="text-sm text-gray-600">本次分类结果是否准确？</span>
          <button class="btn-hover px-4 py-1.5 text-sm text-emerald-600 border border-emerald-500 rounded-lg hover:bg-emerald-50">
            <i class="fas fa-check mr-1"></i>正确
          </button>
          <button class="btn-hover px-4 py-1.5 text-sm text-red-500 border border-red-400 rounded-lg hover:bg-red-50">
            <i class="fas fa-xmark mr-1"></i>错误
          </button>
          <button class="px-3 py-1.5 text-sm text-indigo-600 hover:text-indigo-700 transition-colors duration-200">
            <i class="fas fa-pencil mr-1"></i>修正
          </button>
        </div>

        <!-- 右侧：核心操作 -->
        <div class="flex items-center gap-3">
          <button class="btn-hover px-5 py-2 text-sm text-indigo-600 border border-indigo-500 rounded-lg hover:bg-indigo-50">
            <i class="fas fa-cart-plus mr-1.5"></i>加入组卷篮
          </button>
          <button class="btn-hover px-5 py-2 text-sm text-white bg-emerald-500 rounded-lg hover:bg-emerald-600 hover:shadow-lg shadow-md">
            <i class="fas fa-cloud-arrow-up mr-1.5"></i>存入题库
          </button>
        </div>
      </div>
    </section>

    <!-- ===================== 区域三：底部模型统计区 ===================== -->
    <section class="text-center text-xs text-gray-400 leading-relaxed">
      <i class="fas fa-microchip mr-1"></i>当前模型：BERT-base-Chinese（微调）
      <span class="mx-2 text-gray-300">|</span>
      <i class="fas fa-bolt mr-1"></i>响应延迟：约300ms
      <span class="mx-2 text-gray-300">|</span>
      <i class="fas fa-file-lines mr-1"></i>已处理题目：1,284道
      <span class="mx-2 text-gray-300">|</span>
      <i class="fas fa-chart-line mr-1"></i>近期准确率：96.8%（近100题）
    </section>

  </div>
</body>
</html>
