# 项目工具配置（ruff lint）
# 运行：venv\Scripts\python -m ruff check .
# 说明：legacy/ 为旧版归档（有意保留历史形态），不参与 lint；
#       规则从保守起步（E4/E7/E9/F = ruff 默认集），逐步收紧。

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["legacy", "logs", "venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# scripts 统一采用"先 sys.path 注入项目根、再 import edu_core"的引导模式，E402 属预期
"scripts/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["edu_core", "scripts", "tests"]
