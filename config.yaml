# ------------------------------------------------------------
# 本文件仅供 legacy/ 归档代码读取（legacy/gradio_app.py 等），
# 新代码一律通过 edu_core.config.settings（EDU_ 前缀环境变量 / .env）取配置，
# 工程守护脚本（check_project_guardrails.py）会拦截主链路 import yaml。
# 其中 paths.user_models_source 保留的唯一价值是数据溯源记录，
# 正式溯源文档见根目录 DATA_PROVENANCE.md。
